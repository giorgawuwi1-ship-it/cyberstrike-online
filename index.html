<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CyberStrike Online TDM</title>
    <!-- PeerJS for P2P Networking -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <!-- Google Font for Gaming Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Rajdhani', sans-serif; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #070811; color: #fff; overflow: hidden; }
        
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }

        /* Modern Cyber Lobby */
        #lobby { background: radial-gradient(circle at center, #12162d 0%, #05060c 100%); padding: 20px; }
        
        .header { 
            position: absolute; top: 15px; left: 20px; right: 20px; 
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.2rem; font-weight: 700; 
            background: rgba(15, 20, 38, 0.75); backdrop-filter: blur(12px);
            padding: 10px 25px; border-radius: 12px; 
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0,240,255,0.15);
        }
        .coin-val { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .lvl-val { color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }

        .lang-btn {
            background: rgba(0, 240, 255, 0.2); border: 1px solid #00f0ff; color: #fff;
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-left: 10px;
        }

        .lobby-main { display: flex; gap: 20px; margin-top: 60px; width: 94%; max-width: 1150px; height: 78vh; }
        
        .panel { 
            background: rgba(15, 20, 38, 0.8); backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 16px; 
            padding: 20px; flex: 1; display: flex; flex-direction: column; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        
        h2 { color: #00f0ff; text-transform: uppercase; letter-spacing: 2px; font-size: 1.3rem; margin-bottom: 12px; text-shadow: 0 0 8px rgba(0,240,255,0.4); }
        
        button { 
            background: linear-gradient(135deg, #ff0055, #ff5500); border: none; color: white; 
            padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; 
            font-size: 1rem; transition: all 0.25s ease; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255,0,85,0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,85,0,0.6); }
        button.btn-sec { 
            background: linear-gradient(135deg, #0088ff, #00f0ff); color: #05060c; 
            box-shadow: 0 4px 15px rgba(0,240,255,0.3);
        }

        /* 1v1, 2v2, 3v3 Mode Selector Buttons */
        .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn { 
            flex: 1; padding: 12px; background: rgba(10, 12, 24, 0.8); 
            border: 2px solid rgba(0, 240, 255, 0.3); color: #fff; text-align: center; 
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .mode-btn.active { border-color: #00f0ff; background: rgba(0, 240, 255, 0.2); box-shadow: 0 0 15px rgba(0,240,255,0.4); }

        input { 
            padding: 10px; background: rgba(10, 12, 24, 0.8); border: 1px solid rgba(0, 240, 255, 0.3); 
            color: #fff; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; outline: none;
        }

        .friend-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(22, 27, 50, 0.8); padding: 8px 12px; border-radius: 8px; 
            margin-bottom: 6px; border-left: 4px solid #00f0ff; 
        }

        /* Weapon Shop & Visual Canvas Preview */
        .weapon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; overflow-y: auto; height: 100%; padding-right: 6px; }
        .weapon-card { 
            background: rgba(20, 25, 48, 0.65); border: 1px solid rgba(255,255,255,0.1); 
            padding: 12px; border-radius: 12px; text-align: center; position: relative; transition: 0.2s;
            display: flex; flex-direction: column; align-items: center;
        }
        .weapon-card.unlocked { border-color: rgba(0, 240, 255, 0.4); background: rgba(20, 25, 48, 0.9); }
        .weapon-card.equipped { border-color: #00ff88; background: rgba(0, 255, 136, 0.08); box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        
        .weapon-canvas-preview { width: 140px; height: 50px; background: rgba(0,0,0,0.3); border-radius: 8px; margin: 6px 0; }
        .skin-btn { margin-top: 5px; font-size: 0.8rem; padding: 6px; width: 100%; }

        /* Canvas Game & HUD */
        #gameCanvas { width: 100%; height: 100%; display: block; }
        #hud { position: absolute; top: 15px; left: 20px; right: 20px; pointer-events: none; display: flex; justify-content: space-between; }
        .hud-box { background: rgba(10, 12, 24, 0.75); backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 10px; border: 1px solid rgba(0, 240, 255, 0.3); font-size: 1.1rem; font-weight: 700; }

        /* Mobile Touch UI */
        #touch-controls { position: absolute; bottom: 0; left: 0; right: 0; top: 0; pointer-events: none; display: none; }
        .joystick { position: absolute; bottom: 30px; width: 110px; height: 110px; background: rgba(255,255,255,0.05); border: 2px solid rgba(0,240,255,0.4); border-radius: 50%; pointer-events: auto; }
        #move-joy { left: 30px; } #aim-joy { right: 30px; }
        .weapon-switch-mobile { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: auto; }
        .w-mob-btn { background: rgba(10, 12, 24, 0.85); border: 1px solid #00f0ff; padding: 8px 14px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby" class="screen">
        <div class="header">
            <div>ID: <span id="player-id-display" style="color:#00f0ff;">...</span></div>
            <div>LVL: <span id="lvl-display" class="lvl-val">1</span></div>
            <div>COINS: <span id="coins-display" class="coin-val">0</span> 🪙</div>
            <div>
                <button class="lang-btn" onclick="toggleLanguage()">🌐 <span id="lang-label">GE</span></button>
            </div>
        </div>

        <div class="lobby-main">
            <!-- Left Panel: Matchmaking & Friends -->
            <div class="panel">
                <h2 id="txt-matchmaking">🎮 მატჩის დაწყება</h2>
                
                <!-- Prominent 1v1, 2v2, 3v3 Buttons -->
                <div class="mode-selector">
                    <div class="mode-btn active" onclick="selectMode('1v1')" id="m1">1 VS 1</div>
                    <div class="mode-btn" onclick="selectMode('2v2')" id="m2">2 VS 2</div>
                    <div class="mode-btn" onclick="selectMode('3v3')" id="m3">3 VS 3</div>
                </div>

                <button onclick="startMatchHost()" id="btn-host">🌐 ოთახის შექმნა (Online Host)</button>
                <button onclick="startBotMatch()" class="btn-sec" style="margin-top:8px;" id="btn-bot">🤖 ბოტებთან თამაში (Bot Match)</button>
                
                <hr style="border-color:rgba(0,240,255,0.15); margin: 15px 0;">

                <h2 id="txt-friends">👥 მეგობრების სია</h2>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="friend-id-input" placeholder="მეგობრის ID" style="flex:1;">
                    <button class="btn-sec" onclick="addFriend()" id="btn-add-friend">დამატება</button>
                </div>
                <div id="friends-list" style="margin-top:8px; overflow-y:auto; flex:1;"></div>
            </div>

            <!-- Right Panel: Loadout & Shop -->
            <div class="panel">
                <h2 id="txt-shop">🔫 იარაღები & სკინები (60 იარაღი)</h2>
                <div id="weapon-shop-container" class="weapon-grid"></div>
            </div>
        </div>
    </div>

    <!-- GAME CANVAS SCREEN -->
    <div id="game-screen" class="screen hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="hud">
            <div class="hud-box">❤️ HP: <span id="hp-val" style="color:#00ff88;">100</span></div>
            <div class="hud-box">🔫 <span id="weapon-val" style="color:#00f0ff;">ავტომატი</span></div>
            <div class="hud-box">🎯 KILLS: <span id="kills-val">0</span></div>
        </div>

        <div id="touch-controls">
            <div id="move-joy" class="joystick"></div>
            <div id="aim-joy" class="joystick"></div>
            <div class="weapon-switch-mobile">
                <div class="w-mob-btn" onclick="switchWeaponSlot(1)">1: Auto</div>
                <div class="w-mob-btn" onclick="switchWeaponSlot(2)">2: Pistol/Sniper</div>
                <div class="w-mob-btn" onclick="switchWeaponSlot(3)">3: Knife</div>
            </div>
        </div>
    </div>

    <script>
        // --- TRANSLATIONS (GE / EN) ---
        let currentLang = 'GE';
        const TRANSLATIONS = {
            GE: {
                matchmaking: '🎮 მატჩის დაწყება',
                host: '🌐 ოთახის შექმნა (Online)',
                bot: '🤖 ბოტებთან თამაში (Offline)',
                friends: '👥 მეგობრების სია',
                add: 'დამატება',
                shop: '🔫 იარაღები & სკინები (60 იარაღი)',
                equip: 'დაყენება',
                equipped: '✓ არჩეულია',
                locked: '🔒 ჩაკეტილია',
                buy: 'ყიდვა'
            },
            EN: {
                matchmaking: '🎮 MATCHMAKING',
                host: '🌐 CREATE ROOM (Online)',
                bot: '🤖 PLAY VS BOTS (Offline)',
                friends: '👥 FRIENDS LIST',
                add: 'ADD',
                shop: '🔫 WEAPONS & SKINS (60 WEAPONS)',
                equip: 'EQUIP',
                equipped: '✓ EQUIPPED',
                locked: '🔒 LOCKED',
                buy: 'BUY'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'GE' ? 'EN' : 'GE';
            document.getElementById('lang-label').innerText = currentLang;
            const t = TRANSLATIONS[currentLang];
            document.getElementById('txt-matchmaking').innerText = t.matchmaking;
            document.getElementById('btn-host').innerText = t.host;
            document.getElementById('btn-bot').innerText = t.bot;
            document.getElementById('txt-friends').innerText = t.friends;
            document.getElementById('btn-add-friend').innerText = t.add;
            document.getElementById('txt-shop').innerText = t.shop;
            updateLobbyUI();
        }

        // --- 60 WEAPONS GENERATOR ---
        const WEAPONS = [];
        for (let lvl = 1; lvl <= 20; lvl++) {
            WEAPONS.push({
                id: (lvl - 1) * 3 + 1, name: `Assault Rifle Mk-${lvl}`, slot: 1, levelReq: lvl,
                damage: 16 + lvl * 2, color: '#00f0ff',
                skins: [{ name: 'Neon Flame', price: 1800, color: '#ff0055' }, { name: 'Gold Dragon', price: 3000, color: '#ffd700' }]
            });
            WEAPONS.push({
                id: (lvl - 1) * 3 + 2, name: lvl % 2 === 0 ? `Sniper Hawk-${lvl}` : `Pistol Viper-${lvl}`, slot: 2, levelReq: lvl,
                damage: lvl % 2 === 0 ? 65 + lvl * 3 : 28 + lvl * 2, color: '#ff5500',
                skins: [{ name: 'Cyber Blue', price: 1800, color: '#0088ff' }, { name: 'Void Purple', price: 3000, color: '#aa00ff' }]
            });
            WEAPONS.push({
                id: (lvl - 1) * 3 + 3, name: `Combat Knife V${lvl}`, slot: 3, levelReq: lvl,
                damage: 45 + lvl * 4, color: '#e0e0e0',
                skins: [{ name: 'Red Ruby', price: 1800, color: '#ff0000' }, { name: 'Emerald Blade', price: 3000, color: '#00ff66' }]
            });
        }

        let selectedMode = '1v1';
        function selectMode(m) {
            selectedMode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if(m==='1v1') document.getElementById('m1').classList.add('active');
            if(m==='2v2') document.getElementById('m2').classList.add('active');
            if(m==='3v3') document.getElementById('m3').classList.add('active');
        }

        let player = JSON.parse(localStorage.getItem('cs_player_data')) || {
            coins: 500, level: 1, xp: 0,
            equipped: { 1: 1, 2: 2, 3: 3 },
            equippedSkins: { 1: -1, 2: -1, 3: -1 },
            unlockedSkins: [], friends: []
        };

        function savePlayerData() {
            localStorage.setItem('cs_player_data', JSON.stringify(player));
            updateLobbyUI();
        }

        // --- PEERJS NETWORKING ---
        let peer = new Peer();
        let conn = null;
        peer.on('open', id => document.getElementById('player-id-display').innerText = id);
        peer.on('connection', c => { conn = c; setupNetworkListeners(); initGame(false, false); });

        function addFriend() {
            const fId = document.getElementById('friend-id-input').value.trim();
            if (fId && !player.friends.includes(fId)) {
                player.friends.push(fId); savePlayerData(); document.getElementById('friend-id-input').value = '';
            }
        }

        function startMatchHost() { initGame(true, false); }
        function startBotMatch() { initGame(true, true); }

        function connectToFriend(fId) {
            conn = peer.connect(fId); setupNetworkListeners(); initGame(false, false);
        }

        function setupNetworkListeners() {
            conn.on('data', data => {
                if (data.type === 'GAME_STATE') { remotePlayer = data.player; remoteBullets = data.bullets; }
            });
        }

        // --- LOBBY UI & CANVAS WEAPON PREVIEW DRAWING ---
        function updateLobbyUI() {
            document.getElementById('coins-display').innerText = player.coins;
            document.getElementById('lvl-display').innerText = player.level;
            const t = TRANSLATIONS[currentLang];

            // Friends
            const fList = document.getElementById('friends-list');
            fList.innerHTML = '';
            player.friends.forEach(fId => {
                fList.innerHTML += `<div class="friend-item"><span>${fId.substring(0, 8)}...</span><button class="btn-sec" style="padding:3px 8px; font-size:0.8rem;" onclick="connectToFriend('${fId}')">Join</button></div>`;
            });

            // Weapons
            const shop = document.getElementById('weapon-shop-container');
            shop.innerHTML = '';
            WEAPONS.forEach(w => {
                const unlocked = player.level >= w.levelReq;
                const isEquipped = player.equipped[w.slot] === w.id;
                
                let skinsHTML = '';
                if (unlocked) {
                    w.skins.forEach((s, idx) => {
                        const skinKey = `${w.id}_${idx}`;
                        const hasSkin = player.unlockedSkins.includes(skinKey);
                        const isSkinEquipped = player.equippedSkins[w.slot] === idx && isEquipped;

                        skinsHTML += `
                            <button class="skin-btn ${isSkinEquipped ? 'btn-sec' : ''}" onclick="handleSkinAction(${w.id}, ${w.slot}, ${idx}, ${s.price})">
                                ${hasSkin ? (isSkinEquipped ? t.equipped : `Skin: \${s.name}`) : `\${t.buy}: \\({s.name} (\\){s.price}🪙)`}
                            </button>`;
                    });
                }

                shop.innerHTML += `
                    <div class="weapon-card ${unlocked ? 'unlocked' : ''} ${isEquipped ? 'equipped' : ''}">
                        <div style="font-weight:700; color:${w.color}; font-size:1rem;">${w.name}</div>
                        <canvas id="w-preview-${w.id}" class="weapon-canvas-preview"></canvas>
                        <div style="font-size:0.8rem; color:#aaa;">Damage: ${w.damage} | Lvl: ${w.levelReq}</div>
                        ${unlocked ? `<button onclick="equipWeapon(\${w.id}, \\({w.slot})" style="width:100%; padding:5px; font-size:0.8rem; margin-top:4px;">\\){isEquipped ? t.equipped : t.equip}</button>` : `<div style="color:#ff0055; font-size:0.8rem; margin-top:4px;">\${t.locked}</div>`}
                        ${skinsHTML}
                    </div>`;
            });

            setTimeout(drawWeaponPreviews, 50);
        }

        function drawWeaponPreviews() {
            WEAPONS.forEach(w => {
                const cvs = document.getElementById(`w-preview-${w.id}`);
                if (!cvs) return;
                const c = cvs.getContext('2d');
                cvs.width = 140; cvs.height = 50;
                c.clearRect(0,0,140,50);
                c.fillStyle = w.color;
                
                if (w.slot === 1) { // Rifle
                    c.fillRect(30, 20, 80, 10); c.fillRect(50, 30, 10, 12);
                } else if (w.slot === 2) { // Pistol/Sniper
                    c.fillRect(40, 20, 60, 8); c.fillRect(45, 28, 8, 14);
                } else { // Knife
                    c.beginPath(); c.moveTo(30, 25); c.lineTo(100, 20); c.lineTo(90, 28); c.fill();
                }
            });
        }

        function equipWeapon(wId, slot) { player.equipped[slot] = wId; player.equippedSkins[slot] = -1; savePlayerData(); }

        function handleSkinAction(wId, slot, skinIdx, price) {
            const skinKey = `${wId}_${skinIdx}`;
            if (!player.unlockedSkins.includes(skinKey)) {
                if (player.coins >= price) { player.coins -= price; player.unlockedSkins.push(skinKey); }
                else { return alert('Not enough coins!'); }
            }
            player.equipped[slot] = wId; player.equippedSkins[slot] = skinIdx; savePlayerData();
        }

        // --- GAME ENGINE WITH BOT AI ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let isTouch = 'ontouchstart' in window;
        let activeSlot = 1; let kills = 0; isBotMatch = false;

        let localPlayer = { x: 200, y: 300, hp: 100, angle: 0 };
        let remotePlayer = { x: 600, y: 300, hp: 100, angle: 0 };
        let localBullets = []; let remoteBullets = [];
        let keys = {}; let mouse = { x: 0, y: 0 };

        function initGame(isHost, botMatch) {
            isBotMatch = botMatch;
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            if (isTouch) document.getElementById('touch-controls').style.display = 'block';

            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            localPlayer.x = isHost ? 200 : canvas.width - 200; localPlayer.y = canvas.height / 2;

            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === '1') switchWeaponSlot(1);
                if (e.key === '2') switchWeaponSlot(2);
                if (e.key === '3') switchWeaponSlot(3);
            });
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('mousedown', shoot);

            requestAnimationFrame(gameLoop);
        }

        function switchWeaponSlot(slot) {
            activeSlot = slot;
            const currentW = WEAPONS.find(w => w.id === player.equipped[activeSlot]);
            document.getElementById('weapon-val').innerText = currentW ? currentW.name : 'Weapon';
        }

        function shoot() {
            const currentW = WEAPONS.find(w => w.id === player.equipped[activeSlot]);
            if (!currentW) return;
            const skinIdx = player.equippedSkins[activeSlot];
            const bulletColor = skinIdx >= 0 ? currentW.skins[skinIdx].color : currentW.color;

            localBullets.push({
                x: localPlayer.x, y: localPlayer.y,
                vx: Math.cos(localPlayer.angle) * 14, vy: Math.sin(localPlayer.angle) * 14,
                damage: currentW.damage, color: bulletColor
            });
        }

        function gameLoop() {
            let speed = activeSlot === 3 ? 5.2 : 3.8;
            if (keys['w'] || keys['წ']) localPlayer.y -= speed;
            if (keys['s'] || keys['shared']) localPlayer.y += speed;
            if (keys['a'] || keys['a']) localPlayer.x -= speed;
            if (keys['d'] || keys['d']) localPlayer.x += speed;

            localPlayer.angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);

            // BOT AI LOGIC
            if (isBotMatch) {
                let dx = localPlayer.x - remotePlayer.x;
                let dy = localPlayer.y - remotePlayer.y;
                let dist = Math.hypot(dx, dy);
                remotePlayer.angle = Math.atan2(dy, dx);

                if (dist > 150) {
                    remotePlayer.x += Math.cos(remotePlayer.angle) * 2;
                    remotePlayer.y += Math.sin(remotePlayer.angle) * 2;
                }
                if (Math.random() < 0.03) { // Bot Shooting
                    remoteBullets.push({
                        x: remotePlayer.x, y: remotePlayer.y,
                        vx: Math.cos(remotePlayer.angle) * 10, vy: Math.sin(remotePlayer.angle) * 10,
                        damage: 15, color: '#ff0055'
                    });
                }
            }

            // Bullet Collision
            localBullets.forEach((b, idx) => {
                b.x += b.vx; b.y += b.vy;
                if (Math.hypot(b.x - remotePlayer.x, b.y - remotePlayer.y) < 22) {
                    remotePlayer.hp -= b.damage;
                    localBullets.splice(idx, 1);
                    if (remotePlayer.hp <= 0) { kills++; endGame(true); }
                }
            });

            remoteBullets.forEach((b, idx) => {
                b.x += b.vx; b.y += b.vy;
                if (Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y) < 22) {
                    localPlayer.hp -= b.damage;
                    remoteBullets.splice(idx, 1);
                    if (localPlayer.hp <= 0) endGame(false);
                }
            });

            if (conn && !isBotMatch) {
                conn.send({ type: 'GAME_STATE', player: localPlayer, bullets: localBullets });
            }

            // Render
            ctx.fillStyle = '#0a0d1a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawPlayer(localPlayer, getActiveColor(), true);
            drawPlayer(remotePlayer, '#ff0055', false);

            localBullets.concat(remoteBullets).forEach(b => {
                ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            document.getElementById('hp-val').innerText = Math.max(0, localPlayer.hp);
            if (localPlayer.hp > 0) requestAnimationFrame(gameLoop);
        }

        function getActiveColor() {
            const currentW = WEAPONS.find(w => w.id === player.equipped[activeSlot]);
            if (!currentW) return '#00f0ff';
            const skinIdx = player.equippedSkins[activeSlot];
            return skinIdx >= 0 ? currentW.skins[skinIdx].color : currentW.color;
        }

        function drawPlayer(p, skinColor, isSelf) {
            ctx.save(); ctx.translate(p.x, p.y);
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-20, -32, 40, 6);
            ctx.fillStyle = isSelf ? '#00ff88' : '#ff0055';
            ctx.fillRect(-20, -32, (Math.max(0, p.hp) / 100) * 40, 6);
            ctx.rotate(p.angle);
            ctx.fillStyle = skinColor; ctx.fillRect(10, 4, 16, 6);
            ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fillStyle = isSelf ? '#00f0ff' : '#ff0055'; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = skinColor; ctx.stroke();
            ctx.restore();
        }

        function endGame(won) {
            const baseWinReward = won ? (100 + (player.level - 1) * 10) : 0;
            const killBonus = kills * 5;
            const totalEarned = baseWinReward + killBonus;

            player.coins += totalEarned; player.xp += 60;
            if (player.xp >= player.level * 100) { player.level++; player.xp = 0; }
            savePlayerData();
            alert(`${won ? '🏆 WIN / მოგება!' : '☠️ DEFEAT / წაგება!'}\n+${totalEarned} 🪙`);
            location.reload();
        }

        updateLobbyUI();
    </script>
</body>
</html>
